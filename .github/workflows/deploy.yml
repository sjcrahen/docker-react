name: Deploy Frontend

on: 
  push:
    branches:
      - master

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build test image
        run: docker build -t docker-react-test -f Dockerfile.dev .

      - name: Run tests
        run: docker run -e CI=true docker-react-test npm test -- --watch=false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: us-east-2

      - name: Create deployment package
        run: |
          zip -r deploy_package.zip . \
          -x '*.git*' \
          -x 'node_modules/*' \
          -x 'Dockerfile.dev'

      - name: Deploy to EB
        run: |
          REGION="us-east-2"
          APP_NAME="frontend"
          ENV_NAME="Frontend-env"
          VERSION_LABEL="${GITHUB_RUN_NUMBER}-${GITHUB_SHA}"

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          EB_BUCKET="elasticbeanstalk-${REGION}-${ACCOUNT_ID}"

          aws s3 cp deploy_package.zip "s3://${EB_BUCKET}/${VERSION_LABEL}.zip"

          aws elasticbeanstalk create-application-version \
            --application-name "${APP_NAME}" \
            --version-label "${VERSION_LABEL}" \
            --source-bundle S3Bucket="${EB_BUCKET}",S3Key="${VERSION_LABEL}.zip"

          aws elasticbeanstalk update-environment \
            --environment-name "${ENV_NAME}" \
            --version-label "${VERSION_LABEL}"
